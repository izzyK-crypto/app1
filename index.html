<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Android-Style Web App</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .video-container {
      width: 100%;
      height: auto;
    }

    video {
      width: 100%;
      height: 350;
      display: block;
    }

    .notification-box {
      background: #e0f7fa;
      color: #00796b;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    .slider-container {
        display: block;
        overflow: hidden;
        width: 100%;
        max-width: 90%; /* Shrinks slider width */
        margin: 0 auto; /* Center the slider */
        position: relative;
      }

      .slider {
        display: flex;
        width: 300%; /* 3 slides */
        animation: slide 12s infinite;
      }

      .slide {
        flex: 1 0 100%;
        position: relative;
      }

      .slide img {
       width: 100%;
       max-width: 325px;
       max-height: 180px;     /* Limits height */
       object-fit: cover;     /* Keeps it cropped nicely */
       display: block;
       border-radius: 12px 12px 0 0;
}

      .description {
        background: #ffffff;
        padding: 10px;
        font-size: 16px;
        font-family: 'Segoe UI', sans-serif;
      }

      .description a {
        text-decoration: none;
        color: #07529d;
        font-weight: 600;
        position: relative;
        left: 7%;
      }

      /* Animation */
      @keyframes slide {
        0%   { transform: translateX(0%); }
        33%  { transform: translateX(0%); }
        36%  { transform: translateX(-100%); }
        66%  { transform: translateX(-100%); }
        69%  { transform: translateX(-200%); }
        99%  { transform: translateX(-200%); }
        100% { transform: translateX(0%); }
      }

    .cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
  gap: 10px;
  padding: 10px;
  position: relative;
  top: -7vh;
}

.card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  overflow: hidden;
  text-align: center;
  transition: transform 0.3s;
  height: 190px; /* fixed height for all cards */
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
    height: 150px;           /* consistent image height */
    width: 100%;
    object-fit: cover;       /* crops image nicely without distortion */
    display: block;
}

.card h3 {
  margin: 10px;
  font-size: 16px;
}

    .card-link {
      text-decoration: none;
      color: inherit;
    }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    /* Stagger the animation for each card */
    .card:nth-child(1) { animation-delay: 0s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.4s; }
    .card:nth-child(4) { animation-delay: 0.6s; }
    .card:nth-child(5) { animation-delay: 0.8s; }
    .card:nth-child(6) { animation-delay: 1s; }
    .card:nth-child(7) { animation-delay: 1.2s; }
/* Keep going... */

.heading-box {
        background-color: #f1f1f1;
        padding: 20px;
        text-align: center;
        border-radius: 12px;
        margin: 20px;
        display: block;
      }

      .heading-box h1 {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #2c3e50;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 1px;
        margin: 0;
        position: relative;
        top: -6vh;
      }
      .image-box {
        display: block;
        margin: 20px auto;
        max-width: 80%;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      .image-box img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

    /* Only display on screens with max 600px */
    @media screen and (min-width: 601px) {
      body {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Video Section -->
  <div class="video-container">
    <video autoplay muted loop>
      <source src="hey2.mp4" type="video/mp4" />
      Your browser does not support video playback.
    </video>
  </div>

  <!-- Notifications Section -->
  <div class="notification-box" id="notificationArea">
    🔔 Admin Notice: New updates available. Please check back regularly.
  </div>

  <div class="slider-container">
    <div class="slider">
      <div class="slide">
        <img src="godi.jpg"Slide 1">
        <div class="description">
          <a href="page1.html">Learn more about Slide 1</a>
        </div>
      </div>
      <div class="slide">
        <img src="godi2.jpg" alt="Slide 2">
        <div class="description">
          <a href="page2.html">Explore Slide 2 content</a>
        </div>
      </div>
      <div class="slide">
        <img src="children.jpg" alt="Slide 3">
        <div class="description">
          <a href="page3.html">Discover Slide 3</a>
        </div>
      </div>
    </div>
  </div>


  <div class="image-box">
    <img src="bishop1.jpg" alt="Image">
  </div>

  <div class="heading-box">
    <h1>Welcome to Glory App</h1>
  </div>

  <!-- Cards Section -->
  <div class="cards">
    <a href="page1.html" class="card-link">
      <div class="card">
        <img src="b5.jpg" alt="Image 1" />
        <h3>Card Title 1</h3>
      </div>
    </a>
    <a href="page2.html" class="card-link">
      <div class="card">
        <img src="b6.jpg" alt="Image 2" />
        <h3>Card Title 2</h3>
      </div>
    </a>
    <a href="page3.html" class="card-link">
      <div class="card">
        <img src="b3.jpg" alt="Image 3" />
        <h3>Card Title 3</h3>
      </div>
    </a>
    <a href="page4.html" class="card-link">
      <div class="card">
        <img src="b4.jpg" alt="Image 4" />
        <h3>Card Title 4</h3>
      </div>
    </a>
  </div>

</body>
</html>
